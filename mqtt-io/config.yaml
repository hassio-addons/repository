name: MQTT IO
version: 0.5.0
slug: mqtt-io
description: Expose GPIO modules and digital sensors via MQTT for remote control and
  monitoring.
url: https://github.com/hassio-addons/app-mqtt-io
arch:
- aarch64
- amd64
init: false
hassio_api: true
homeassistant_api: true
full_access: true
services:
- mqtt:want
privileged:
- SYS_RAWIO
map:
- addon_config:rw
- homeassistant_config:rw
- share:rw
- ssl
options:
  configuration_file: /config/mqtt-io/config.yml
schema:
  configuration_file: str
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
image: ghcr.io/hassio-addons/mqtt-io/{arch}
