name: Audiobookshelf
version: 0.1.0
slug: audiobookshelf
description: Self-hosted audiobook and podcast server
url: https://github.com/hassio-addons/app-audiobookshelf
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:book-music
init: false
arch:
- aarch64
- amd64
backup: cold
backup_exclude:
- '**/metadata/cache/**'
- '**/metadata/logs/**'
- '**/metadata/streams/**'
- '**/metadata/tmp/**'
map:
- type: media
  read_only: false
- type: share
  read_only: false
- type: ssl
  read_only: true
ports:
  13378/tcp: null
ports_description:
  13378/tcp: Web interface & API (not required for Ingress)
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.io/hassio-addons/audiobookshelf
