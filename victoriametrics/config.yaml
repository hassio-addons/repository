name: VictoriaMetrics
version: 0.1.0
slug: victoriametrics
description: Fast and resource efficient time series database for your metrics
url: https://github.com/hassio-addons/app-victoriametrics
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:database-clock
startup: services
init: false
arch:
- aarch64
- amd64
auth_api: true
homeassistant_api: true
backup: cold
ports:
  8428/tcp: null
ports_description:
  8428/tcp: HTTP API & web interface (not required for Ingress)
map:
- type: addon_config
  read_only: true
- type: ssl
  read_only: true
options:
  home_assistant: false
  scrape_interval: 60s
  retention_period: 3y
  min_free_disk_space: 1GB
  latency_offset: 1m
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  home_assistant: bool
  scrape_interval: str
  scrape_config: str?
  retention_period: str
  dedup_min_scrape_interval: str?
  min_free_disk_space: str
  latency_offset: str
  memory_allowed_percent: int(10,90)?
  ssl: bool
  certfile: str
  keyfile: str
  leave_front_door_open: bool?
image: ghcr.io/hassio-addons/victoriametrics
