name: Actual Budget
version: 0.1.0
slug: actual-budget
description: Local-first personal finance and envelope budgeting
url: https://github.com/hassio-addons/app-actual-budget
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:cash-multiple
init: false
arch:
- aarch64
- amd64
backup: cold
map:
- type: ssl
  read_only: true
ports:
  5006/tcp: null
ports_description:
  5006/tcp: Web interface & API (not required for Ingress)
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.io/hassio-addons/actual-budget
