name: Homebox
version: 0.1.0
slug: homebox
description: Inventory and organization system for the things in your home
url: https://github.com/hassio-addons/app-homebox
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:package-variant-closed
init: false
arch:
- aarch64
- amd64
backup: cold
map:
- type: ssl
  read_only: true
ports:
  7745/tcp: null
ports_description:
  7745/tcp: Web interface & API (not required for Ingress)
options:
  allow_registration: true
  auto_increment_asset_id: true
  max_upload_size: 10
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  base_url: url?
  allow_registration: bool
  auto_increment_asset_id: bool
  max_upload_size: int(1,)
  smtp_host: str?
  smtp_port: port?
  smtp_from: email?
  smtp_user: str?
  smtp_password: password?
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.io/hassio-addons/homebox
