name: Syncthing
version: 0.1.0
slug: syncthing
description: Continuous file synchronization between all your devices
url: https://github.com/hassio-addons/app-syncthing
ingress: true
ingress_port: 0
ingress_stream: true
panel_icon: mdi:folder-sync
init: false
arch:
- aarch64
- amd64
host_network: true
ports:
  8384/tcp: null
ports_description:
  8384/tcp: Web interface (not required for Ingress)
map:
- type: homeassistant_config
  read_only: false
- type: addon_config
  read_only: false
- type: all_addon_configs
  read_only: false
- type: addons
  read_only: false
- type: share
  read_only: false
- type: media
  read_only: false
- type: backup
  read_only: false
- type: ssl
  read_only: true
backup_exclude:
- '**/index-v2/**'
options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.io/hassio-addons/syncthing
