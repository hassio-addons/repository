name: Stirling PDF
version: 0.1.0
slug: stirling-pdf
description: Do everything you need to a PDF, on your own machine
url: https://github.com/hassio-addons/app-stirling-pdf
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:file-pdf-box
init: false
arch:
- aarch64
- amd64
auth_api: true
backup: cold
map:
- type: addon_config
  read_only: false
- type: ssl
  read_only: true
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Web interface & API (not required for Ingress)
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  base_url: url?
  max_file_size: int(1,)?
  leave_front_door_open: bool?
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.io/hassio-addons/stirling-pdf
