name: Spotweb
version: 0.1.0
slug: spotweb
description: A decentralized usenet community based on the Spotnet protocol
url: https://github.com/hassio-addons/app-spotweb
ingress: true
ingress_stream: true
init: false
panel_icon: mdi:spotlight-beam
arch:
- aarch64
- amd64
map:
- ssl
ports:
  80/tcp: null
ports_description:
  80/tcp: Web interface (Not required for Ingress)
options:
  retrieve_interval: 15
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  admin_password: password?
  retrieve_interval: int(0,1440)
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.io/hassio-addons/spotweb
