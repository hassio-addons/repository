name: InfluxDB v1
version: 6.0.0
slug: influxdb
description: InfluxDB 1.x time series database with Chronograf and Kapacitor
url: https://github.com/hassio-addons/app-influxdb
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:chart-areaspline
startup: services
hassio_api: true
arch:
- aarch64
- amd64
init: false
map:
- share:rw
- ssl
ports:
  80/tcp: null
  8086/tcp: 8086
  8088/tcp: 8088
  8089/udp: null
  9092/tcp: null
ports_description:
  80/tcp: Chronograf web interface (Not required for Ingress)
  8086/tcp: InfluxDB HTTP API
  8088/tcp: InfluxDB RPC service for backup and restore
  8089/udp: InfluxDB UDP listener (Needs to be enabled using envvars)
  9092/tcp: Kapacitor HTTP API
ulimits:
  nofile: 65535
auth_api: true
options:
  auth: true
  reporting: false
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  envvars: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  auth: bool
  reporting: bool
  ssl: bool
  certfile: str
  keyfile: str
  envvars:
  - name: match(^INFLUXDB_([A-Z0-9_])+$)
    value: str
  leave_front_door_open: bool?
image: ghcr.io/hassio-addons/influxdb
