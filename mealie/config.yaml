name: Mealie
version: 0.1.0
slug: mealie
description: Recipe manager and meal planner for your kitchen
url: https://github.com/hassio-addons/app-mealie
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:silverware-fork-knife
init: false
arch:
- aarch64
- amd64
backup: cold
map:
- type: ssl
  read_only: true
ports:
  9000/tcp: null
ports_description:
  9000/tcp: Web interface & API (not required for Ingress)
options:
  allow_signup: false
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  base_url: url?
  allow_signup: bool
  smtp_host: str?
  smtp_port: port?
  smtp_from_name: str?
  smtp_from_email: email?
  smtp_auth_strategy: list(TLS|SSL|NONE)?
  smtp_user: str?
  smtp_password: password?
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.io/hassio-addons/mealie
