---
configuration:
  log_level:
    name: Log level
    description: >-
      Controls the level of log output by the app and can be changed to be
      more or less verbose, which might be useful when you are dealing with
      an unknown issue. Each level automatically includes the messages of a
      more severe level.
  base_url:
    name: Base URL
    description: >-
      The address this app is reached at, for example
      `https://mealie.example.com`. Used for the links in the emails Mealie
      sends and for the OpenID Connect callback. Leave it empty when you only
      use this app from your own network.
  allow_signup:
    name: Allow public sign-up
    description: >-
      Let anybody who can reach this app create an account without an
      invitation. Leave this off and invite people from the user management
      page instead.
  smtp_host:
    name: SMTP host
    description: >-
      The mail server used to send invitations, password resets and
      notifications. Leave it empty to switch email off entirely.
  smtp_port:
    name: SMTP port
    description: The port of the mail server, usually 587.
  smtp_from_name:
    name: SMTP sender name
    description: The name the emails from this app appear to come from.
  smtp_from_email:
    name: SMTP sender address
    description: The address the emails from this app are sent from.
  smtp_auth_strategy:
    name: SMTP authentication
    description: >-
      How the connection to the mail server is secured. Use `TLS` unless your
      provider tells you otherwise. `NONE` sends unauthenticated, which only
      makes sense for a relay on your own network.
  smtp_user:
    name: SMTP username
    description: >-
      The username for the mail server. Leave it empty when the server needs
      no authentication.
  smtp_password:
    name: SMTP password
    description: The password that goes with the SMTP username.
  ssl:
    name: SSL
    description: >-
      Enables/Disables encrypted SSL (HTTPS) for direct access to the app.
      This setting has no effect on the Ingress service.
  certfile:
    name: Certificate file
    description: >-
      The certificate file to use for SSL. The file must be stored in the
      `/ssl/` directory.
  keyfile:
    name: Private key file
    description: >-
      The private key file to use for SSL. The file must be stored in the
      `/ssl/` directory.
network:
  9000/tcp: >-
    Web interface and API. Not required for Ingress. Expose this port when
    something outside Home Assistant needs to reach Mealie, such as a phone
    app or a reverse proxy of your own.
