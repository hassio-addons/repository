name: n8n
version: 0.1.0
slug: n8n
description: Workflow automation for technical people, with Home Assistant and MQTT
  wired in
url: https://github.com/hassio-addons/app-n8n
ingress: true
ingress_stream: true
panel_icon: mdi:graph-outline
init: false
arch:
- aarch64
- amd64
backup: cold
backup_exclude:
- .cache/**
- .n8n/crash.journal
- .n8n/n8nEventLog*.log
- '**/node_modules/**'
homeassistant_api: true
services:
- mqtt:want
- mysql:want
map:
- type: addon_config
  read_only: false
- type: media
  read_only: false
- type: share
  read_only: false
- type: ssl
ports:
  80/tcp: null
ports_description:
  80/tcp: Web interface and webhooks (not required for Ingress)
options:
  home_assistant_credential: true
  mqtt_credential: true
  mariadb_credential: true
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  env_vars: []
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  home_assistant_credential: bool
  mqtt_credential: bool
  mariadb_credential: bool
  webhook_url: url?
  ssl: bool
  certfile: str
  keyfile: str
  max_old_space_size: int?
  env_vars:
  - name: match(^[A-Z][A-Z0-9_]*$)
    value: str
image: ghcr.io/hassio-addons/n8n
