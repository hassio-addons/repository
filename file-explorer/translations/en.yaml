---
configuration:
  log_level:
    name: Log level
    description: >-
      Controls the level of log output by the app and can be changed to be
      more or less verbose, which might be useful when you are dealing with
      an unknown issue. Each level automatically includes the messages of a
      more severe level.
  password:
    name: Password
    description: >-
      The password of the `admin` account, which is what the login screen on
      the published port accepts. Leave it empty when Home Assistant signs you
      in over Ingress and you do not use the published port from a browser.
  ingress_auto_login:
    name: Sign in with Home Assistant
    description: >-
      Let Home Assistant sign you in when you open this app from the sidebar,
      with an account of your own named after your Home Assistant user. Turn it
      off to have File Browser ask for the `admin` password instead.
  ssl:
    name: SSL
    description: >-
      Enables/Disables encrypted SSL (HTTPS) for direct access to the app.
      This setting has no effect on the Ingress service.
  certfile:
    name: Certificate file
    description: >-
      The certificate file to use for SSL. The file must be stored in the
      `/ssl/` directory.
  keyfile:
    name: Private key file
    description: >-
      The private key file to use for SSL. The file must be stored in the
      `/ssl/` directory.
network:
  80/tcp: >-
    Web interface, API and WebDAV. Not required for Ingress. Expose this port
    when something outside Home Assistant needs to reach File Browser, such as
    a computer mounting a directory over WebDAV, or a reverse proxy of your
    own.
