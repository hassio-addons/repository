name: File Explorer
version: 0.1.0
slug: file-explorer
description: Browse, edit, upload and organize the files of your Home Assistant installation
url: https://github.com/hassio-addons/app-file-explorer
ingress: true
ingress_port: 1337
ingress_stream: true
panel_icon: mdi:folder-open
init: false
arch:
- aarch64
- amd64
backup: cold
backup_exclude:
- '**/cache/**'
map:
- type: homeassistant_config
  read_only: false
  path: /config
- type: local_apps
  read_only: false
- type: all_app_configs
  read_only: false
- type: backup
  read_only: false
- type: media
  read_only: false
- type: share
  read_only: false
- type: ssl
  read_only: false
ports:
  80/tcp: null
ports_description:
  80/tcp: Web interface, API & WebDAV (not required for Ingress)
options:
  ingress_auto_login: true
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  password: password?
  ingress_auto_login: bool
  ssl: bool
  certfile: str
  keyfile: str
image: ghcr.io/hassio-addons/file-explorer
